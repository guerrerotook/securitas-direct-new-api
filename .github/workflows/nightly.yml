name: Nightly (latest deps)

# Runs the repo's checks against the LATEST upstream dependencies (Home
# Assistant stable, beta and dev, the test harness, HACS/hassfest) on a daily
# schedule. This is an early-warning system for breakage introduced by new HA
# releases, kept SEPARATE from PR CI (tests.yaml / validate.yaml) which pin/range their deps.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-latest:
    name: Tests against latest HA + harness
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-channel: [stable, beta, dev]
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libturbojpeg0-dev

      - uses: actions/setup-python@v6
        with:
          # Match the dev, beta and stable channels in tests.yaml: the latest HA line
          # (2026.3+) requires 3.14, so the "latest deps" lane must run here
          # too — on 3.13 pip would silently cap HA at the newest 3.13-compatible
          # release instead of the actual latest.
          python-version: "3.14"

      - name: Install latest dependencies
        run: |
          pip install --upgrade pip
          # Fails the job if a later install moves HA off the version it asked for.
          python scripts/ci_ha_install.py "${{ matrix.ha-channel }}" \
            --requirements requirements_test.txt

      - name: Show resolved versions
        run: |
          pip list
          python -c "from homeassistant.const import __version__; print(__version__)"

      - name: Run ${{ matrix.suite }} tests
        run: |
          if [ "${{ matrix.suite }}" = "unit" ]; then
            MARKER="not integration"
          else
            MARKER="integration"
          fi
          python -m pytest tests/ -v --tb=short -m "$MARKER" -p no:cov

  validate-latest:
    name: Validate against latest HA (hassfest + HACS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
